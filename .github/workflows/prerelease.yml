# 내부 테스트 배포 — release/x.y.z 브랜치에서 수동 실행할 때마다 v x.y.z-rc.N 태그 + Pre-release.
#
# · 브랜치 이름의 버전과 소스의 OneS1ght.SDK_VERSION 이 같아야 한다.
# · 테스트 앱만 이 태그를 정확 버전으로 받는다 — 고객 빌드는 프리릴리스 태그를 고르지 않는다.
# · 정식 v x.y.z 가 이미 있으면 실패한다. 배포된 판에 rc 를 더 달 수 없다.
#
# 수동 실행 전용 — GitHub Actions 무료 한도(월 2,000분) 보호를 위해 자동 트리거를 껐다.
# 되살리려면 on: 에 push: branches: ['release/**'] 를 추가한다.
name: prerelease

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rc:
    runs-on: ubuntu-latest
    env:
      # 단계 if: 에서는 secrets 를 읽을 수 없어(워크플로 파일이 무효가 된다) 작업 env 로 먼저 옮긴다.
      HAS_NEXUS: ${{ secrets.GEOPLAN_NEXUS_URL != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 태그 목록이 필요하다
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-37.0"
      - name: Nexus 계정 설정 (있으면 — 엔진 어댑터 컴파일용)
        if: env.HAS_NEXUS == 'true'
        env:
          GEOPLAN_NEXUS_URL: ${{ secrets.GEOPLAN_NEXUS_URL }}
          GEOPLAN_NEXUS_USER: ${{ secrets.GEOPLAN_NEXUS_USER }}
          GEOPLAN_NEXUS_PASSWORD: ${{ secrets.GEOPLAN_NEXUS_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          {
            echo "geoplanNexusUrl=$GEOPLAN_NEXUS_URL"
            echo "geoplanNexusUser=$GEOPLAN_NEXUS_USER"
            echo "geoplanNexusPassword=$GEOPLAN_NEXUS_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: 브랜치 이름과 소스 버전 대조
        id: ver
        run: |
          BRANCH_VERSION="${GITHUB_REF_NAME#release/}"
          SRC_VERSION=$(Scripts/sdk-version.sh)
          if [[ ! "$BRANCH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::브랜치 이름이 release/x.y.z 형식이 아니다: $GITHUB_REF_NAME"; exit 1
          fi
          if [[ "$BRANCH_VERSION" != "$SRC_VERSION" ]]; then
            echo "::error::브랜치는 release/$BRANCH_VERSION 인데 소스 SDK_VERSION 은 $SRC_VERSION — 판올림 커밋이 빠졌다"; exit 1
          fi
          TAG=$(Scripts/next-rc-tag.sh "$SRC_VERSION")
          { echo "version=$SRC_VERSION"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
          echo "::notice::$TAG 를 만든다"

      - name: 검사 (버전 일치 · 마이그레이션 · CHANGELOG · 테스트)
        run: Scripts/check-release.sh "${{ steps.ver.outputs.version }}"

      - name: rc 태그
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG (내부 테스트)"
          git push origin "$TAG"

      - name: 태그가 실제로 담은 것 확인
        run: Scripts/verify-tag.sh "${{ steps.ver.outputs.tag }}"

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "**내부 테스트용** — 고객 빌드에는 잡히지 않습니다."
            echo
            echo "---"
            echo
            Scripts/changelog-section.sh "$VERSION"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --prerelease --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

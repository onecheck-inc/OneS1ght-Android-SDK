[versions]
# compileSdk 37 을 지원하는 최신 안정판(rc/alpha 제외). AGP 9 이상은 내장 Kotlin 지원을 쓴다.
agp = "9.4.1"
kotlin = "2.2.21"
# ⚠️ 아래 런타임 의존은 "최신" 이 아니라 "kotlin-stdlib 2.0 이하를 요구하는 판" 에 묶어 둔다 — 고객 앱 Kotlin 1.9+ 호환.
#    이유: AGP 는 고객 앱의 컴파일 클래스패스 버전을 런타임 버전에 맞추므로, implementation 의존이라도
#    kotlin-stdlib 2.1+ 를 끌어오면 고객 앱에 stdlib 2.1+ 가 올라가 Kotlin 1.9 컴파일러가 읽지 못한다
#    (2.2 면 Kotlin 2.0 도 못 읽는다). 이전 값: coroutines 1.10.2 · serialization 1.9.0 · lifecycle 2.11.0 ·
#    activity 1.13.0 → stdlib 2.2.0 이 끌려와 Kotlin 2.0.21 소비자가 컴파일러 예외로 죽었다.
#    올릴 때는 Scripts/consumer-compat-check.sh 가 통과하는지 먼저 본다.
kotlinxCoroutines = "1.9.0"            # stdlib 2.0.0 을 요구 (1.10.2 는 2.1.0)
kotlinxSerializationJson = "1.7.3"     # stdlib 2.0 대 (1.9.0 은 2.2.0)
okhttp = "4.12.0"                      # stdlib 1.9.10 — 공개 API 에는 안 나온다(JavaApiSurfaceTest)
junit = "4.13.2"
androidxLifecycleProcess = "2.8.7"     # stdlib 1.x 대 (2.11.0 은 2.1.20)
# permissions(activity) — ActivityResultRegistry · RequestMultiplePermissions. 공개 API(api 의존).
# 하한 선언일 뿐이라 고객 앱이 더 새 activity 를 쓰면 그쪽으로 올라간다.
androidxActivity = "1.9.3"             # core 1.13 · stdlib 1.8 대 (1.13 은 core 1.18 → stdlib 2.1.20)

# 측위 엔진(gpa-ihub 1.1.1 → gpa-prm 2.0.0 · gpa-dltdoa 2.1.0)의 전이 의존. 엔진 POM 에 적힌 버전과
# 같아야 한다(어긋나면 링크 단계에서 NoSuchMethodError 등으로 깨질 수 있다).
# 전부 순수 Java 라 kotlin-stdlib 를 끌어오지 않는다. androidx.core 는 하한 선언이다 — androidx.activity 가
# 이미 더 새 판(1.13, stdlib 1.8 대)을 가져오므로 실제로는 그쪽으로 올라간다.
engineAndroidxCore = "1.10.1" # gpa-ihub POM
gson = "2.10.1" # gpa-ihub POM
jtsVividsolutions = "1.13" # gpa-prm POM (com.vividsolutions — jts-core 의 옛 좌표, 패키지가 달라 둘 다 필요)
commonsMath3 = "3.6.1" # gpa-dltdoa POM
jtsCore = "1.18.2" # gpa-dltdoa POM
slf4jApi = "1.7.31" # gpa-dltdoa POM

# Maven Central(Sonatype Central Portal) 배포 — 서명·POM·소스/javadoc jar·업로드를 한 플러그인이 맡는다.
# 0.37.0 = AGP 9 · Gradle 9 대응 최신 정식판(플러그인 API 9.0.0 기준 빌드).
mavenPublish = "0.37.0"
# javadoc jar 를 Dokka(HTML)로 만든다 — AGP 9 내장 Kotlin 과 함께 동작하는 2.x.
dokka = "2.2.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycleProcess" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
geoplan-engine-androidx-core = { module = "androidx.core:core", version.ref = "engineAndroidxCore" }
geoplan-engine-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
geoplan-engine-jts-vividsolutions = { module = "com.vividsolutions:jts", version.ref = "jtsVividsolutions" }
geoplan-engine-commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commonsMath3" }
geoplan-engine-jts-core = { module = "org.locationtech.jts:jts-core", version.ref = "jtsCore" }
geoplan-engine-slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4jApi" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
